    <h2>Đăng ký thông tin sinh viên</h2>
    <form action="/register" method="post">
      <label for="fullName">Họ và tên</label>
      <input
        id="fullName"
        name="fullName"
        type="text"
        placeholder="Nhập họ tên"
        required
      />

      <br />

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Nhập email"
        required
      />

      <br />

      <label for="password">Mật khẩu</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Nhập password"
        required
      />

      <br />

      <label for="birthday">Ngày sinh</label>
      <input
        id="birthday"
        name="birthday"
        type="date"
        placeholder="Chọn ngày sinh"
        required
      />

      <br />

      <label for="gender">Giới tính</label>
      <input id="male" name="gender" type="radio" />
      <label for="nale">Nam</label>
      <input id="female" name="gender" type="radio" />
      <label for="female">Nữ</label>

      <br />

      <label for="skill">Kỹ năng</label>
      <input id="html" name="skills" type="checkbox" />
      <label for="html">Html</label>
      <input id="css" name="skills" type="checkbox" />
      <label for="css">CSS</label>
      <input id="js" name="skills" type="checkbox" />
      <label for="js">JS</label>

      <br />

      <button type="submit">Đăng ký</button>
      <button type="reset">Làm mới</button>
    </form>
